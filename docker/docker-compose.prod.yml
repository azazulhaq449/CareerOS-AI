# Production-style stack — optimized builds, no bind mounts, no hot reload.
# React apps are compiled and served by nginx; the API runs as a published
# release build. Run: docker compose -f docker/docker-compose.prod.yml up --build
# See docs/Docker-Guide.md for a full step-by-step walkthrough.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careeros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careeros}
      POSTGRES_USER: ${POSTGRES_USER:-careeros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - careeros-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careeros}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    container_name: careeros-server-prod
    restart: unless-stopped
    build:
      context: ../src/server
      target: prod
    ports:
      - "5257:5257"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__CareerOS: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-careeros};Username=${POSTGRES_USER:-careeros};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      AdminUser__Email: ${ADMIN_EMAIL}
      AdminUser__Password: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  client:
    container_name: careeros-client-prod
    restart: unless-stopped
    build:
      context: ../src/client
      target: prod
      args:
        VITE_API_BASE_URL: http://localhost:5257
    ports:
      - "5173:80"

  admin:
    container_name: careeros-admin-prod
    restart: unless-stopped
    build:
      context: ../src/admin
      target: prod
      args:
        VITE_API_BASE_URL: http://localhost:5257
    ports:
      - "5174:80"

volumes:
  careeros-postgres-data:
