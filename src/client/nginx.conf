server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the requested file if it exists, otherwise fall back to
    # index.html — required for any client-side routing to survive a
    # hard refresh or direct link (harmless even for this app's simpler
    # single-page anchor-scroll layout).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
