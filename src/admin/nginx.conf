server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Critical here (not just nice-to-have): this app uses React Router
    # client-side routes (/experience, /projects, ...). Without this
    # fallback, a hard refresh or direct link to any route other than "/"
    # would 404, since nginx has no file matching that path on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
